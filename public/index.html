<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060918">
<title>Багийн квиз</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#060918; --glass:rgba(255,255,255,.05); --glass2:rgba(255,255,255,.09); --stroke:rgba(255,255,255,.12);
  --ink:#EEF1FF; --muted:#9AA3C7; --gold:#FFC53D; --gold2:#FF8A1F; --gold-ink:#231700;
  --pink:#FF3D9A; --cyan:#2DE2E6; --violet:#7C5CFF; --ok:#3DDC84; --bad:#FF5A5F;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg0)}
body{margin:0;color:var(--ink);font:400 16px/1.55 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background:radial-gradient(1200px 700px at 50% -10%,#1C2668 0%,transparent 60%),radial-gradient(900px 600px at 105% 105%,#3A0F4F 0%,transparent 60%),radial-gradient(700px 500px at -10% 90%,#062E45 0%,transparent 60%),var(--bg0);
  background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0}
h2{font-size:19px;line-height:1.25}
h3{font-size:15px;font-weight:500}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
::selection{background:var(--pink);color:#fff}

/* stage lights */
.stage{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.beam{position:absolute;top:-25vh;width:70vw;height:150vh;transform-origin:50% 0;filter:blur(6px)}
.beam.b1{left:-20vw;background:conic-gradient(from 168deg at 50% 0%,transparent 0deg,rgba(124,92,255,.22) 8deg,rgba(124,92,255,.05) 18deg,transparent 24deg);animation:sway1 11s ease-in-out infinite alternate}
.beam.b2{right:-20vw;background:conic-gradient(from 168deg at 50% 0%,transparent 0deg,rgba(255,61,154,.18) 8deg,rgba(255,61,154,.04) 18deg,transparent 24deg);animation:sway2 13s ease-in-out infinite alternate}
.beam.b3{left:15vw;background:conic-gradient(from 170deg at 50% 0%,transparent 0deg,rgba(45,226,230,.12) 7deg,transparent 18deg);animation:sway3 17s ease-in-out infinite alternate}
@keyframes sway1{from{transform:rotate(-28deg)}to{transform:rotate(8deg)}}
@keyframes sway2{from{transform:rotate(26deg)}to{transform:rotate(-10deg)}}
@keyframes sway3{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
.floor{position:absolute;left:-10%;right:-10%;bottom:-30vh;height:60vh;background:radial-gradient(closest-side,rgba(124,92,255,.25),transparent);filter:blur(30px);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55;transform:scale(1.08)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.5px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);opacity:.18;animation:drift 60s linear infinite}
@keyframes drift{to{background-position:460px 460px}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

#root{position:relative;z-index:1}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(6,9,24,.6);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--stroke)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:rgba(6,9,24,.9)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:17px}
.mark{width:32px;height:32px;border-radius:10px;background:conic-gradient(from 0deg,var(--gold),var(--pink),var(--violet),var(--cyan),var(--gold));display:grid;place-items:center;font-size:17px;color:#fff;box-shadow:0 0 20px rgba(255,61,154,.5);animation:spin 8s linear infinite}
.mark span{display:block;animation:spin 8s linear infinite reverse;text-shadow:0 1px 4px #0008}
@keyframes spin{to{transform:rotate(360deg)}}
.phase{font-size:12.5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);color:var(--muted)}
.phase.live{color:#fff;border-color:rgba(255,61,154,.5);background:rgba(255,61,154,.12)}
.phase.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-right:7px;vertical-align:1px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px}
.top select{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--stroke);border-radius:10px;padding:7px 9px;max-width:220px}
.top select option{background:#111833}
.linkbtn{background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--ink);border-radius:10px;padding:6px 11px;cursor:pointer;transition:background .2s}
.linkbtn:hover{background:rgba(255,255,255,.14)}
.who-pill{display:flex;align-items:center;gap:8px;font-weight:600}

.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 70px}
.wrap.enter{animation:enter .6s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.stack{display:grid;gap:18px}
.card{position:relative;background:linear-gradient(180deg,var(--glass2),var(--glass));border:1px solid var(--stroke);border-radius:20px;padding:20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.card > h2{margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.grad{background:linear-gradient(90deg,var(--gold),var(--pink),var(--violet),var(--cyan),var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 8s linear infinite}
@keyframes shimmer{to{background-position:300% 0}}

/* buttons */
.btn{position:relative;overflow:hidden;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink);line-height:1.2;box-shadow:0 6px 22px rgba(255,138,31,.35);transition:transform .15s,box-shadow .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,138,31,.5)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(0) scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn[disabled]::after{display:none}
.btn.sec{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--stroke);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);border:1px dashed var(--stroke);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,90,95,.6);box-shadow:none}
.btn.big{padding:15px 26px;font-size:17px;border-radius:14px}
.btn.cyan{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#fff;box-shadow:0 6px 22px rgba(124,92,255,.4)}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:5px 9px;border-radius:8px}
.icon-btn:hover{background:rgba(255,255,255,.08);color:var(--ink)}

label.f{display:grid;gap:5px;font-size:13.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=password],textarea,select{background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-radius:11px;padding:10px 12px;width:100%;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(45,226,230,.2)}
textarea{resize:vertical;min-height:80px}

/* login */
.login{min-height:78vh;display:grid;place-items:center}
.login .card{width:min(440px,100%);text-align:center;display:grid;gap:16px;padding:34px 28px;animation:enter .8s cubic-bezier(.2,.8,.2,1)}
.login h1{font-size:clamp(30px,7vw,44px);font-weight:900;line-height:1.05}
.codein{font-family:var(--display);font-size:30px;letter-spacing:.35em;text-align:center;padding:14px!important}
.orb{width:84px;height:84px;margin:0 auto;border-radius:26px;background:conic-gradient(from 0deg,var(--gold),var(--pink),var(--violet),var(--cyan),var(--gold));display:grid;place-items:center;font-size:40px;box-shadow:0 0 60px rgba(124,92,255,.6);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* setup */
.steps{display:grid;gap:18px}
.step-h{display:flex;gap:12px;align-items:baseline;margin-bottom:12px}
.num{font-family:var(--display);font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pink),var(--violet));width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font-size:14px;box-shadow:0 0 18px rgba(255,61,154,.5)}
.qform{display:grid;grid-template-columns:1.2fr .6fr;gap:10px}
.qform .wide{grid-column:1/-1}
.qgroup{margin-top:18px}
.qgroup h3{margin-bottom:6px;color:var(--cyan)}
.qrow{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--stroke)}
.pts{font-family:var(--display);font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink);border-radius:8px;padding:3px 9px;flex:none;min-width:50px;text-align:center}
.qtext{flex:1;min-width:0;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--muted);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--stroke);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px;transition:transform .15s,background .2s,border-color .2s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:linear-gradient(135deg,rgba(255,197,61,.25),rgba(255,61,154,.2));border-color:var(--gold)}
.chip.on::before{content:"★ ";color:var(--gold)}
.issues{display:grid;gap:4px;font-size:14px}
.issues .bad{color:var(--bad)}
.issues .warn{color:var(--muted)}
.radio{display:flex;gap:8px;align-items:center;cursor:pointer}

/* board */
.board-wrap{position:relative;border-radius:22px;padding:16px;overflow-x:auto;background:linear-gradient(180deg,rgba(18,26,74,.85),rgba(10,15,44,.9));border:1px solid rgba(124,92,255,.35);box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 60px rgba(124,92,255,.15)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);gap:12px}
.col{display:grid;gap:10px;align-content:start}
.topic{font-family:var(--display);font-weight:700;font-size:13.5px;text-align:center;padding:8px 4px 12px;min-height:54px;display:grid;place-items:center;overflow-wrap:anywhere;color:#fff;text-shadow:0 0 18px rgba(45,226,230,.55);border-bottom:2px solid rgba(45,226,230,.35)}
.tile{position:relative;height:68px;border:0;padding:0;background:transparent;perspective:700px;cursor:default}
.tile .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.tile .fr,.tile .bk{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tile .fr{background:linear-gradient(160deg,#2A3A94,#16205C);border:1px solid rgba(255,255,255,.14);font-family:var(--display);font-weight:900;font-size:clamp(19px,2.2vw,26px);color:var(--gold);text-shadow:0 0 14px rgba(255,197,61,.6),0 2px 0 #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px rgba(0,0,0,.35);transition:background .2s,color .2s,box-shadow .2s}
.tile .bk{background:linear-gradient(160deg,#151A36,#0C1028);border:1px solid rgba(255,255,255,.06);transform:rotateY(180deg);color:rgba(255,255,255,.22);font-size:22px}
.tile.used .in{transform:rotateY(180deg)}
.tile.can{cursor:pointer}
.tile.can .in{animation:ready 2.4s ease-in-out infinite;animation-delay:calc(var(--d,0) * 90ms)}
@keyframes ready{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.tile.can:hover .fr{background:linear-gradient(160deg,var(--gold),var(--gold2));color:var(--gold-ink);text-shadow:none;box-shadow:0 0 30px rgba(255,197,61,.7)}
.tile.can:hover .in{transform:translateY(-5px) scale(1.05);animation:none}
.tile.sel .fr{background:linear-gradient(160deg,var(--pink),var(--violet));color:#fff;text-shadow:0 0 12px #fff;animation:selpulse 1s ease-in-out infinite}
@keyframes selpulse{50%{box-shadow:0 0 40px rgba(255,61,154,.9)}}
.board-note{color:var(--muted);font-size:13.5px;margin-top:12px}

/* layout */
.play{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:920px){.play{grid-template-columns:minmax(0,1fr)}.qform{grid-template-columns:1fr}}

.turn{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;padding:16px 20px 16px 26px;border-radius:18px;background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--gold)) 28%,transparent),rgba(255,255,255,.04) 60%);border:1px solid var(--stroke)}
.turn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--gold));box-shadow:0 0 22px var(--c,var(--gold))}
.turn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);animation:sweep 3.5s ease-in-out infinite;pointer-events:none}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.turn .who{font-family:var(--display);font-weight:700;font-size:clamp(16px,2vw,20px)}
.roundinfo{font-family:var(--display);font-size:13px;color:var(--muted);white-space:nowrap;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.25)}

.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;display:inline-block;box-shadow:0 0 10px var(--c)}
.score-list{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 8px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid transparent}
.srow.p1{background:linear-gradient(90deg,rgba(255,197,61,.18),rgba(255,197,61,.03));border-color:rgba(255,197,61,.35)}
.place{font-family:var(--display);font-weight:900;font-size:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--muted)}
.p1 .place{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink)}
.p2 .place{background:linear-gradient(135deg,#E6E9F5,#9AA3C7);color:#1A1E33}
.p3 .place{background:linear-gradient(135deg,#E8A46B,#A15F2F);color:#2A1404}
.sname{font-weight:700;display:flex;gap:8px;align-items:center}
.members{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.sval{font-family:var(--display);font-weight:900;font-size:24px;text-shadow:0 0 16px rgba(255,255,255,.25);display:inline-block}
.sval.bump{animation:bump .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.5);color:var(--gold);text-shadow:0 0 24px var(--gold)}100%{transform:scale(1)}}

/* question card */
.qcard{position:relative;border-radius:24px;padding:24px;display:grid;gap:16px;border:2px solid transparent;
  background:linear-gradient(170deg,#141C52,#0B0F33) padding-box,linear-gradient(120deg,var(--pink),var(--violet),var(--cyan),var(--gold),var(--pink)) border-box;background-size:100% 100%,300% 300%;animation:border 6s linear infinite;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 60px rgba(124,92,255,.25)}
@keyframes border{to{background-position:0 0,300% 300%}}
.qcard.urgent{animation:border 1.2s linear infinite,urgent 1s ease-in-out infinite}
@keyframes urgent{50%{box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 70px rgba(255,90,95,.65)}}
.qhead{display:flex;gap:16px;align-items:center}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;flex:1}
.qbody{font-size:clamp(21px,2.7vw,30px);font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.qbody.reveal-in{animation:qin .9s cubic-bezier(.2,.8,.2,1)}
@keyframes qin{from{opacity:0;filter:blur(14px);transform:scale(.94) translateY(10px)}to{opacity:1;filter:none;transform:none}}
.qbody.hidden{color:var(--muted);font-size:20px}
.reveal{background:rgba(0,0,0,.28);border-radius:14px;padding:12px 16px;border:1px solid rgba(255,197,61,.25)}
.reveal .lbl{font-size:13px;color:var(--muted)}
.reveal .val{font-size:19px;font-weight:700;color:var(--gold);text-shadow:0 0 18px rgba(255,197,61,.45)}
.reveal.pop{animation:popin .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes popin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.alist{display:grid;gap:10px}
.arow{background:rgba(0,0,0,.25);border-radius:14px;padding:12px 14px;display:grid;gap:8px;border:1px solid var(--stroke);border-left:5px solid var(--c)}
.arow.right{border-color:rgba(61,220,132,.5);border-left-color:var(--ok);background:linear-gradient(90deg,rgba(61,220,132,.14),rgba(0,0,0,.2))}
.arow.wrong{opacity:.75}
.arow .t{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arow .ans{font-size:17px;overflow-wrap:anywhere}
.grade{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gbtn{border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--ink);border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:700;transition:transform .12s}
.gbtn:hover{transform:translateY(-1px)}
.gbtn.on.ok{background:var(--ok);border-color:var(--ok);color:#03200f;box-shadow:0 0 18px rgba(61,220,132,.5)}
.gbtn.on.no{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 0 18px rgba(255,90,95,.5)}
.grade input{width:96px;padding:7px 9px}
.awarded{font-family:var(--display);font-weight:900;color:var(--gold)}
.arow.right .awarded{color:var(--ok)}
.sent{color:var(--muted);font-size:14px}
.lockmsg{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:rgba(255,90,95,.12);border:1px solid rgba(255,90,95,.4);color:#FFC9CA;font-weight:600;animation:popin .5s cubic-bezier(.2,1.5,.4,1)}
.saved{font-size:13.5px;color:var(--ok)}

/* timer ring */
.timer{position:relative;width:76px;height:76px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .bg{stroke:rgba(255,255,255,.1)}
.timer .fg{stroke:url(#tgrad);stroke-linecap:round;transition:stroke-dashoffset .15s linear}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px}
.timer.urgent .fg{stroke:var(--bad)}
.timer.urgent .t{color:var(--bad);animation:tickpulse 1s ease-in-out infinite}
.timer.over .t{color:var(--muted);font-size:11px}
@keyframes tickpulse{0%{transform:scale(1.25)}60%{transform:scale(1)}}

/* countdown overlay */
#cd{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(20,14,60,.75),rgba(4,6,18,.93));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px}
#cd[hidden]{display:none}
#cd .box{text-align:center;display:grid;gap:8px;place-items:center}
#cd .lbl{font-family:var(--display);font-size:clamp(14px,2.2vw,20px);color:var(--muted)}
#cd .meta{font-family:var(--display);font-size:clamp(18px,3vw,30px);font-weight:700}
#cd .numwrap{position:relative;width:min(60vmin,420px);height:min(60vmin,420px);display:grid;place-items:center}
#cd .n{font-family:var(--display);font-weight:900;font-size:min(42vmin,300px);line-height:1;background:linear-gradient(135deg,var(--gold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(255,61,154,.6));animation:cdn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes cdn{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}80%{transform:scale(.92);opacity:1}100%{transform:scale(.6);opacity:0}}
#cd .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--cyan);animation:ring 1s ease-out both}
#cd .ring.r2{border-color:var(--pink);animation-delay:.12s}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.25);opacity:0}}

/* draft */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.team{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,transparent),rgba(255,255,255,.03));border:1px solid var(--stroke);border-radius:18px;padding:16px;overflow:hidden;transition:transform .3s,box-shadow .3s}
.team::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c);box-shadow:0 0 20px var(--c)}
.team.active{transform:translateY(-4px);box-shadow:0 0 0 2px var(--gold),0 0 40px rgba(255,197,61,.35)}
.team h3{display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:6px}
.team ul{margin:0;padding-left:18px}
.team li.pop{animation:popli .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes popli{0%{opacity:0;transform:translateX(-20px) scale(.6);color:var(--gold)}60%{color:var(--gold)}100%{opacity:1;transform:none}}
.team .cap{color:var(--muted);font-size:13px;margin-bottom:4px}
.pool .chip{font-size:16px}
.pool .chip.pick{background:linear-gradient(135deg,rgba(255,197,61,.22),rgba(255,138,31,.12));border-color:var(--gold);animation:glowchip 2s ease-in-out infinite}
.pool .chip.pick:hover{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--gold-ink)}
@keyframes glowchip{50%{box-shadow:0 0 18px rgba(255,197,61,.45)}}
.pool .chip.idle{cursor:default}
.pool .chip.idle:hover{transform:none}

/* order */
.order-list{display:grid;gap:12px;perspective:900px}
.oitem{display:flex;gap:16px;align-items:center;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(255,255,255,.03) 70%);border:1px solid var(--stroke);border-radius:16px;padding:14px 18px}
.oitem .n{font-family:var(--display);font-weight:900;font-size:30px;color:var(--c);width:40px;text-shadow:0 0 18px var(--c)}
.oitem .nm{font-weight:700;font-size:19px}
.anim .oitem{animation:slidein .8s cubic-bezier(.2,1.2,.3,1) both;animation-delay:calc(var(--i) * .55s)}
@keyframes slidein{from{opacity:0;transform:translateX(-60px) rotateY(30deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

/* final */
.final-title{font-size:clamp(30px,5vw,52px);font-weight:900;text-align:center}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;max-width:900px;margin:10px auto 0;width:100%}
.pod{position:relative;border-radius:20px 20px 10px 10px;padding:20px 16px;text-align:center;border:1px solid var(--stroke);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,transparent),rgba(255,255,255,.03));animation:rise .9s cubic-bezier(.2,1.3,.3,1) both}
.pod.pl1{min-height:280px;animation-delay:.9s;box-shadow:0 0 70px rgba(255,197,61,.35);border-color:rgba(255,197,61,.6)}
.pod.pl2{min-height:220px;animation-delay:.5s}
.pod.pl3{min-height:180px;animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
.pod .crown{font-size:42px;line-height:1;animation:float 3s ease-in-out infinite}
.pod .pl{font-family:var(--display);font-weight:900;font-size:44px;line-height:1}
.pl1 .pl{color:var(--gold);text-shadow:0 0 30px var(--gold)}
.pod .nm{font-weight:700;font-size:18px;margin-top:10px}
.pod .sc{font-family:var(--display);font-size:16px;margin-top:4px}
@media (max-width:640px){.podium{grid-template-columns:1fr}.pod.pl1{order:-1}.pod.pl1,.pod.pl2,.pod.pl3{min-height:0}}

.status-list{display:grid;gap:8px}
.status-list div{display:flex;gap:10px;align-items:center}
.okmark{color:var(--ok);font-weight:700}
.waitmark{color:var(--muted)}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.codes{display:grid;gap:10px}
.codes .crow{display:flex;gap:12px;align-items:center;padding:12px 14px;background:rgba(0,0,0,.22);border:1px solid var(--stroke);border-radius:14px;flex-wrap:wrap}
.codes .code{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.14em;margin-left:auto;color:var(--gold);text-shadow:0 0 14px rgba(255,197,61,.4)}
.offline{position:relative;z-index:2;background:var(--bad);color:#fff;text-align:center;padding:6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,26,60,.94);border:1px solid var(--stroke);color:var(--ink);padding:12px 20px;border-radius:14px;font-size:15px;z-index:90;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:toastin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,20px)}}
.foot{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13.5px}
.tbgroup{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:700}
.spec .qbody{font-size:clamp(24px,3.4vw,40px)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .beam,.dots,.floor{display:none}
}
</style>
</head>
<body>
<div class="stage" aria-hidden="true"><i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="floor"></i><i class="dots"></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="tgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DE2E6"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient></defs></svg>
<div id="root"></div>
<div id="cd" hidden></div>
<canvas id="fx"></canvas>
<div id="toast" class="toast" hidden></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
